spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_connect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2407}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${APP_PORT:8080}

# Auth mode: "dev" (bearer token = profile id, no external IdP) or "clerk".
app:
  auth:
    mode: ${AUTH_MODE:dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

clerk:
  issuer-uri: ${CLERK_ISSUER_URL:}
  jwk-set-uri: ${CLERK_JWKS_URL:}
  webhook-secret: ${CLERK_WEBHOOK_SECRET:dummy_secret}

storage:
  mode: ${FILE_STORAGE_MODE:local}
  root: ${FILE_STORAGE_ROOT:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
